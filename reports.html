<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f7a3d"><title>Myrmex Reports</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="hub.js"></script><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png" type="image/png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#0A0D0A"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Myrmex Hub">
<style>
:root{--g:#1f7a3d;--gd:#155c2c;--ink:#1b1f1d;--mu:#5b6b60;--bd:#d7e2da;--bg:#f4f7f5;--cd:#fff}
@media(prefers-color-scheme:dark){:root{--ink:#eef1ef;--mu:#a9b6ae;--bd:#2c3b31;--bg:#121712;--cd:#182019}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px Calibri,"Segoe UI",Arial,sans-serif;padding:max(14px,env(safe-area-inset-top)) 14px 60px}
.w{max-width:860px;margin:0 auto}
.top{background:#fff;border:1px solid var(--bd);border-bottom:3px solid var(--g);border-radius:10px;padding:12px 18px;text-align:center;margin-bottom:12px}.top img{max-width:200px;width:100%}
.top p{margin:4px 0 0;font-size:.8rem;letter-spacing:1px;text-transform:uppercase;color:var(--gd);font-weight:700}
.nav,.act{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
button{font:inherit;cursor:pointer;border-radius:8px;padding:9px 16px;font-weight:600;border:1.5px solid var(--g);background:transparent;color:var(--g)}
button.p{background:var(--g);color:#fff}button.x{border-color:#e0b4b4;color:#c0392b;padding:5px 9px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;margin-bottom:14px}.card h3{margin:0 0 6px;font-size:.95rem;color:var(--g)}
label{display:block;font-size:.8rem;color:var(--mu);margin:9px 0 3px}label.r:after{content:" *";color:#c0392b}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit;font-size:.92rem}
textarea{min-height:64px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.types{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tc{display:block;text-align:left;padding:16px;border:1.5px solid var(--bd);background:var(--cd);color:var(--ink)}.tc b{display:block;color:var(--g);margin-bottom:4px}.tc span{font-size:.8rem;color:var(--mu);font-weight:400}
.tr{display:flex;gap:6px;margin-bottom:6px;align-items:center}.tr>*{min-width:0}.tr .t{flex:0 0 84px;text-align:right;font-size:.8rem;color:var(--mu)}
.ck{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)}.ck span{flex:1}.ck select{width:92px}
.ph{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.ph div{width:120px}.ph img{width:120px;height:90px;object-fit:cover;border-radius:6px}.ph input{font-size:.75rem;padding:4px}
canvas{width:100%;height:100px;border:1px solid var(--bd);border-radius:7px;background:#fff;touch-action:none;display:block}
.note{color:var(--mu);font-size:.85rem}.sv{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.sv small{color:var(--mu)}
table{width:100%;border-collapse:collapse;font-size:.86rem;margin-bottom:6px}th,td{text-align:left;padding:4px 6px;border-bottom:1px solid #e2e8e4}td.r,th.r{text-align:right}
.rp{background:#fff;color:#1b1f1d;border-radius:10px;padding:26px 28px;border:1px solid var(--bd)}
.rh{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;border-bottom:3px solid var(--g);padding-bottom:12px;margin-bottom:16px}.rh img{max-width:150px}.rh h2{margin:8px 0 0;color:var(--gd);font-size:1.1rem}.rh small{color:#5b6b60;font-size:.78rem}
.rm{text-align:right;font-size:.82rem;color:#5b6b60}.rs{margin-bottom:14px}.rs h4{margin:0 0 6px;font-size:.82rem;text-transform:uppercase;letter-spacing:.5px;color:var(--gd);border-bottom:1px solid #e2e8e4;padding-bottom:3px}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:5px 18px;font-size:.9rem;margin-bottom:6px}.rg span,.tx span{display:block;color:#5b6b60;font-size:.74rem}
.tx{white-space:pre-wrap;font-size:.9rem;line-height:1.45;margin-bottom:8px}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}.kp div{background:#e8f4ec;border-radius:8px;padding:8px;font-size:.72rem;color:#5b6b60}.kp b{display:block;font-size:1rem;color:#155c2c}
.pg{display:flex;flex-wrap:wrap;gap:8px}.pg div{width:150px;font-size:.72rem;color:#5b6b60}.pg img{width:150px;height:110px;object-fit:cover;border-radius:6px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:22px}.sg div{border-top:1px solid #999;padding-top:5px;font-size:.84rem}.sg img{max-height:55px;display:block}
.tt{text-align:right;font-size:.9rem}.ft{text-align:center;font-size:.72rem;color:#8a978d;margin-top:18px}
@media(max-width:560px){.g2,.types,.rg,.sg{grid-template-columns:1fr}.kp{grid-template-columns:1fr 1fr}.rp{padding:16px}}
@media print{body{background:#fff;padding:0}.top,.nav,.act{display:none!important}.rp{border:none;padding:0}.rs,tr{page-break-inside:avoid}.rh,.kp div{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body><style>.hubnav{display:flex;gap:6px;flex-wrap:wrap;max-width:860px;margin:0 auto 12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.hubnav a{padding:7px 14px;border-radius:20px;font-size:12.5px;font-weight:600;text-decoration:none;color:#71796E;border:1px solid #323A2E;background:rgba(128,128,128,.08)}.hubnav a.on{background:#388E3C;border-color:#388E3C;color:#fff}@media print{.hubnav{display:none!important}}</style><nav class="hubnav"><a href="index.html">⌂ Hub</a><a href="quotes.html">Quotations</a><a href="invoices.html">Invoices</a><a href="reports.html">Reports</a></nav><script>document.querySelectorAll(".hubnav a").forEach(function(a){if(location.pathname.endsWith(a.getAttribute("href")))a.classList.add("on")})</script><div class="w">

function tbl(k,l,cols,calc){const rows=cur[k]=cur[k]&&cur[k].length?cur[k]:[[]];T[k]=[cols,calc];
 rows.forEach(r=>cols.forEach(([,ct],j)=>{if(Array.isArray(ct)&&!r[j])r[j]=ct[0]}));
 return(l?`<label>${l}</label>`:'')+rows.map((r,i)=>`<div class="tr">${cols.map(([cl,ct],j)=>Array.isArray(ct)?`<select data-t="${k}:${i}:${j}">${ct.map(o=>`<option${r[j]===o?' selected':''}>${o}</option>`).join('')}</select>`:`<input type="${ct==='n'?'number':'text'}" placeholder="${cl}" data-t="${k}:${i}:${j}" value="${esc(r[j])}">`).join('')}${calc?`<span class="t" data-rt="${k}:${i}"></span>`:''}<button class="x" data-del="${k}:${i}">✕</button></div>`).join('')+`<button data-add="${k}">+ Add row</button>`+(calc&&!['mat','lab','trn'].includes(k)?`<div class="tt" data-ts="${k}"></div>`:'')}
function fld(f){const[k,l,t,x,y]=f,v=cur[k];
 if(t==='text'||t==='date'||t==='time')return inp(k,l,t,v,y===1);
 if(t==='area')return`<label class="${y===1?'r':''}">${l}</label><textarea data-k="${k}">${esc(v)}</textarea>`;
 if(t==='sel')return sel(k,l,x,v);
 if(t==='svc')return sel('category','Service category',Object.keys(SVC),cur.category)+sel('sub','Specific service',SVC[cur.category]||[],cur.sub);
 if(t==='table')return tbl(k,l,x,y);
 if(t==='check')return x.map((it,i)=>`<div class="ck"><span>${it}</span><select data-c="${k}:${i}">${['','Pass','Fail','N/A'].map(o=>`<option${(cur[k]||[])[i]===o?' selected':''}>${o}</option>`).join('')}</select></div>`).join('');
 if(t==='photos')return`<input type="file" id="pin" accept="image/*" multiple><div class="ph">${cur.photos.map((p,i)=>`<div><img src="${p.s}"><input data-cap="${i}" placeholder="Caption" value="${esc(p.c)}"><button class="x" data-del="photos:${i}">Remove</button></div>`).join('')}</div>`;
 if(t==='sigs')return`<div class="g2">${x.map(n=>`<div><label>${n}</label><canvas data-sg="${n}"></canvas><button class="x" data-clr="1">Clear</button></div>`).join('')}</div>`;
 if(t==='costs')return COSTS.map(c=>tbl(c[0],c[1],c[2],c[3])).join('')+`<label><input type="checkbox" data-k="vat" style="width:auto" ${cur.vat?'checked':''}> Apply VAT (16%)</label><div id="ctot"></div>`;
 if(t==='fin')return'<div id="finbox"></div>'}
function pad(c){const n=c.dataset.sg,x=c.getContext('2d'),W=500,H=170;c.width=W;c.height=H;
 if(cur.sigs[n]){const i=new Image();i.onload=()=>x.drawImage(i,0,0,W,H);i.src=cur.sigs[n]}
 let dn=0;const p=e=>{const b=c.getBoundingClientRect();return[(e.clientX-b.left)*W/b.width,(e.clientY-b.top)*H/b.height]};
 c.onpointerdown=e=>{dn=1;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...p(e))};
 c.onpointermove=e=>{if(!dn)return;x.strokeStyle='#1b1f1d';x.lineWidth=2.2;x.lineCap='round';x.lineTo(...p(e));x.stroke()};
 c.onpointerup=()=>{if(!dn)return;dn=0;cur.sigs[n]=c.toDataURL('image/png');draft()};
 c.parentNode.querySelector('[data-clr]').onclick=()=>{x.clearRect(0,0,W,H);cur.sigs[n]=null;draft()}}
function calc(){for(const k in T){const[cols,cl]=T[k];if(!cl||!cur[k])continue;let s=0;cur[k].forEach((r,i)=>{const a=rowAmt(cl,r);s+=a;const e=document.querySelector(`[data-rt="${k}:${i}"]`);if(e)e.textContent=kes(a)});const e=document.querySelector(`[data-ts="${k}"]`);if(e)e.innerHTML='Total: <b>'+kes(s)+'</b>'}
 const c=$('#ctot');if(c)c.innerHTML=ctot(cur);const f=$('#finbox');if(f)f.innerHTML=fin(cur)}
function draw(){T={};const D=TYPES[cur.type];
 $('#formv').innerHTML=`<h2 style="color:var(--g);margin:6px 0">${D.n}</h2><div class="card"><div class="g2"><div>${inp('date','Report date','date',cur.date)}</div><div><label>Report reference</label><input value="${esc(cur.ref)}" readonly></div></div>${inp('link','Linked quote / job ref (optional)','text',cur.link)}</div>`
 +D.s.map(s=>`<div class="card"><h3>${s.t}</h3>${s.f.map(fld).join('')}</div>`).join('')
 +'<div class="act"><button class="p" data-act="gen">Generate report</button><button data-act="save">Save</button><button data-act="home">Cancel</button></div>';
 document.querySelectorAll('canvas[data-sg]').forEach(pad);calc()}
function draft(){clearTimeout(tmr);tmr=setTimeout(()=>{try{localStorage.setItem(DK,JSON.stringify(cur))}catch(e){}},400)}
function show(v){['home','formv','savedv','rptv'].forEach(id=>$('#'+id).hidden=id!==v);scrollTo(0,0)}
function home(){$('#home').innerHTML=`<p class="note">Choose a report type to start.</p><div class="types">${Object.entries(TYPES).map(([k,v])=>`<button class="tc" data-type="${k}"><b>${v.n}</b><span>${v.d}</span></button>`).join('')}</div>`;show('home')}
function start(t){let d=null;try{d=JSON.parse(localStorage.getItem(DK))}catch(e){}
 cur=(d&&d.type===t&&confirm('Resume your unsaved '+TYPES[t].n+' draft?'))?d:blank(t);draw();show('formv')}
function save(){const l=load(),i=l.findIndex(r=>r.id===cur.id);cur.saved=new Date().toISOString();i>=0?l[i]=cur:l.unshift(cur);if(store(l)){localStorage.removeItem(DK);return true}}
function gen(){const m=[];TYPES[cur.type].s.forEach(s=>s.f.forEach(f=>{if(f[4]===1&&!String(cur[f[0]]||'').trim())m.push(f[1])}));
 if(m.length){alert('Please fill in: '+m.join(', '));return}if(save())rep(cur)}
function fin(r){const rd=k=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}},inr=x=>(!r.from||x.date>=r.from)&&(!r.to||x.date<=r.to);
 const q=rd('myrmex_standalone_quotes').filter(inr),iv=rd('myrmex_invoices').filter(x=>inr(x)&&x.status!=='Void');
 if(!q.length&&!iv.length)return'<p class="note">No quotations or invoices found for this period on this device. They are read from the Myrmex quotation and invoice generators when these run on the same site.</p>';
 const sm=(a,f)=>a.reduce((s,x)=>s+(f?f(x):x.total||0),0),st=x=>x.status||'Draft';
 const grp=(a,f)=>{const m={};a.forEach(x=>{const k=f(x)||'—';(m[k]=m[k]||{n:0,v:0}).n++;m[k].v+=x.total||0});return Object.entries(m).sort((a,b)=>b[1].v-a[1].v)};
 const tb=(h,rows,u)=>`<table><tr><th>${h}</th><th class="r">${u}</th><th class="r">Value</th></tr>${rows.map(([k,m])=>`<tr><td>${esc(k)}</td><td class="r">${m.n}</td><td class="r">${kes(m.v)}</td></tr>`).join('')}</table>`;
 const kp=a=>'<div class="kp">'+a.map(([l,v])=>`<div>${l}<b>${v}</b></div>`).join('')+'</div>';
 let h='';
 if(q.length){const acc=q.filter(x=>st(x)==='Accepted'),dec=acc.length+q.filter(x=>st(x)==='Rejected').length;
  h+='<div class="tx"><span>Quotations</span></div>'+kp([['Quotes issued',q.length],['Total quoted',kes(sm(q))],['Accepted value',kes(sm(acc))],['Win rate',dec?Math.round(acc.length/dec*100)+'%':'—']])+tb('Status',grp(q,st),'Quotes')+tb('Division',grp(q,x=>x.division),'Quotes')+tb('Top clients',grp(q,x=>x.client).slice(0,5),'Quotes')}
 if(iv.length){const od=iv.filter(x=>{const d=new Date(x.date);d.setDate(d.getDate()+(x.validity||14));return x.balance>0&&d<new Date()});
  h+='<div class="tx" style="margin-top:10px"><span>Invoices</span></div>'+kp([['Invoiced',kes(sm(iv))],['Collected',kes(sm(iv,x=>x.deposit))],['Outstanding',kes(sm(iv,x=>x.balance))],['Overdue',od.length+(od.length?' ('+kes(sm(od,x=>x.balance))+')':'')]])+tb('Status',grp(iv,st),'Invoices')+tb('Top clients',grp(iv,x=>x.client).slice(0,5),'Invoices')}
 return h}
function ttab(k,l,cols,calc,r){const rows=(r[k]||[]).filter(x=>rowFilled(cols,x));if(!rows.length)return'';let s=0;
 const h=cols.map(([c,ct])=>`<th${ct==='n'?' class="r"':''}>${c}</th>`).join('')+(calc?'<th class="r">Amount</th>':'');
 const bd=rows.map(x=>{const a=calc?rowAmt(calc,x):0;s+=a;return'<tr>'+cols.map(([,ct],j)=>`<td${ct==='n'?' class="r"':''}>${esc(x[j])}</td>`).join('')+(calc?`<td class="r">${kes(a)}</td>`:'')+'</tr>'}).join('');
 return(l?`<div class="tx"><span>${l}</span></div>`:'')+`<table><tr>${h}</tr>${bd}</table>`+(calc&&!['mat','lab','trn'].includes(k)?`<div class="tt">Total: <b>${kes(s)}</b></div>`:'')}
function sec(s,r){let g='',b='';
 for(const[k,l,t,x,y]of s.f){const v=r[k];
  if(['text','date','time','sel'].includes(t)){if(v)g+=`<div><span>${l}</span>${esc(v)}</div>`}
  else if(t==='svc')g+=`<div><span>Category</span>${esc(r.category)}</div><div><span>Specific service</span>${esc(r.sub)}</div>`;
  else if(t==='area'){if(v)b+=`<div class="tx"><span>${l}</span>${esc(v)}</div>`}
  else if(t==='table')b+=ttab(k,l,x,y,r);
  else if(t==='check'){const a=x.map((it,i)=>[it,(r[k]||[])[i]]).filter(z=>z[1]);if(a.length)b+=`<table><tr><th>Check</th><th>Result</th></tr>${a.map(z=>`<tr><td>${z[0]}</td><td>${z[1]}</td></tr>`).join('')}</table>`}
  else if(t==='photos'){if(r.photos.length)b+=`<div class="pg">${r.photos.map(p=>`<div><img src="${p.s}">${esc(p.c)}</div>`).join('')}</div>`}
  else if(t==='sigs')b+=`<div class="sg">${x.map(n=>`<div>${r.sigs[n]?`<img src="${r.sigs[n]}">`:'<br><br>'}${n}</div>`).join('')}</div>`;
  else if(t==='costs')b+=COSTS.map(c=>ttab(c[0],c[1],c[2],c[3],r)).join('')+ctot(r);
  else if(t==='fin')b+=fin(r)}
 return g||b?`<div class="rs"><h4>${s.t}</h4>${g?`<div class="rg">${g}</div>`:''}${b}</div>`:''}
function rep(r){const D=TYPES[r.type];
 $('#rptv').innerHTML=`<div class="act"><button class="p" onclick="print()">Print / Save as PDF</button><button data-edit="${r.id}">Back to edit</button></div><div class="rp"><div class="rh"><div><img src="${LOGO}" alt="Myrmex"><h2>${r.type==='FN'&&r.title?r.title:D.n}</h2><small>${esc(biz())}</small></div><div class="rm"><div>Ref: <b>${esc(r.ref)}</b></div><div>Date: <b>${esc(r.date)}</b></div>${r.link?`<div>Linked ref: <b>${esc(r.link)}</b></div>`:''}</div></div>${D.s.map(s=>sec(s,r)).join('')}<div class="ft">Myrmex Property Maintenance · myrmex.co.ke</div></div>`;show('rptv')}
let flt='';
function saved(){const l=load().filter(r=>!flt||r.type===flt);
 $('#savedv').innerHTML=`<div class="act"><select id="flt" style="width:auto"><option value="">All types</option>${Object.keys(TYPES).map(k=>`<option value="${k}"${flt===k?' selected':''}>${TYPES[k].n}</option>`).join('')}</select><button data-act="exp">Export backup</button><button data-act="imp">Import backup</button><input type="file" id="impf" accept="application/json" hidden></div><p class="note">Reports are stored only in this browser. Export a backup regularly.</p>`
 +(l.length?l.map(r=>`<div class="card sv"><div><b>${esc(r.client||(r.type==='FN'?r.title:'')||TYPES[r.type].n)}${r.site?' — '+esc(r.site):''}</b><br><small>${esc(r.ref)} · ${TYPES[r.type].n} · ${esc(r.date)}</small></div><div class="act" style="margin:0"><button data-view="${r.id}">View</button><button data-edit="${r.id}">Edit</button><button class="x" data-rm="${r.id}">Delete</button></div></div>`).join(''):'<p class="note">No saved reports yet.</p>');show('savedv')}
function down(f,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.6))};i.src=r.result};r.readAsDataURL(f)}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset,f=id=>load().find(r=>String(r.id)===id)||(cur&&String(cur.id)===id?cur:null);
 if(d.go==='home')home();else if(d.go==='saved')saved();
 else if(d.type)start(d.type);
 else if(d.view)rep(f(d.view));
 else if(d.edit){const r=f(d.edit);if(r){cur=JSON.parse(JSON.stringify(r));draw();show('formv')}}
 else if(d.rm){if(confirm('Delete this report? This cannot be undone.')){store(load().filter(r=>String(r.id)!==d.rm));saved()}}
 else if(d.add){cur[d.add].push([]);draw()}
 else if(d.del){const[k,i]=d.del.split(':');(k==='photos'?cur.photos:cur[k]).splice(+i,1);draw()}
 else if(d.act==='gen')gen();else if(d.act==='save'){if(save())alert(cur.ref+' saved.')}else if(d.act==='home')home();
 else if(d.act==='exp'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(load(),null,2)],{type:'application/json'}));a.download='myrmex-reports-backup-'+today()+'.json';a.click()}
 else if(d.act==='imp')$('#impf').click()});
function onEdit(e){const t=e.target,d=t.dataset;
 if(t.id==='flt'){flt=t.value;saved();return}
 if(t.id==='impf'){const f=t.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const inc=JSON.parse(rd.result);if(!Array.isArray(inc))throw 0;const l=load();let a=0,u=0;inc.forEach(r=>{if(!r||!r.id||!TYPES[r.type])return;const i=l.findIndex(x=>x.id===r.id);if(i>=0){l[i]=r;u++}else{l.unshift(r);a++}});store(l);saved();alert('Import complete: '+a+' added, '+u+' updated.')}catch(x){alert("Couldn't read that file. Use a Myrmex reports backup (.json).")}};rd.readAsText(f);return}
 if(!t.closest('#formv'))return;
 if(t.id==='pin'){const fs=[...t.files].filter(f=>f.type.startsWith('image/'));let n=fs.length;fs.forEach(f=>down(f,s=>{cur.photos.push({s,c:''});if(!--n){draw();draft()}}));return}
 if(d.k){cur[d.k]=t.type==='checkbox'?t.checked:t.value;if(d.k==='category'){cur.sub=SVC[cur.category][0];draw();return}}
 else if(d.t){const[k,i,j]=d.t.split(':');cur[k][i][j]=t.value}
 else if(d.c){const[k,i]=d.c.split(':');(cur[k]=cur[k]||[])[+i]=t.value}
 else if(d.cap!=null)cur.photos[+d.cap].c=t.value;
 calc();draft()}
document.addEventListener('input',onEdit);document.addEventListener('change',onEdit);
home();
if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
</script></body></html>
