<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png" type="image/png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#0A0D0A"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Myrmex Hub">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--mid:#388E3C;--text:#EEF1EC;--sec:#A9B2A6;--mut:#71796E;--bd:#232922;--bds:#323A2E;--surf:#0A0D0A;--panel:#0E120D;--field:#1C231C}
body{background:var(--surf);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:max(24px,env(safe-area-inset-top)) 18px 40px;min-height:100vh}
.wrap{max-width:900px;margin:0 auto}.logo{height:34px;width:auto;display:block;margin-bottom:6px}.tag{color:var(--sec);font-size:11px;font-weight:700;letter-spacing:.12em;margin-bottom:22px}
h1{font-size:22px;margin-bottom:4px}.sub{color:var(--mut);font-size:13px;margin-bottom:18px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.c{display:block;background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:18px;text-decoration:none;color:var(--text)}.c:hover{border-color:var(--mid)}
.c b{display:block;font-size:16px;margin-bottom:4px}.c span{font-size:12.5px;color:var(--sec)}.c i{display:block;font-style:normal;font-size:11px;color:var(--mid);margin-top:10px;font-weight:600}
.k{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.k div{background:var(--field);border-radius:10px;padding:12px;font-size:11px;color:var(--mut)}.k b{display:block;font-size:15px;color:var(--text);margin-top:3px}
.box{background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:16px}.box p{font-size:12.5px;color:var(--sec);margin:4px 0 12px}
button{background:var(--field);color:var(--text);border:1px solid var(--bds);border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;margin-right:8px}button:hover{border-color:var(--mid)}
@media(max-width:700px){.cards{grid-template-columns:1fr}.k{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap">

<h1>Document Hub</h1><div class="sub">Quotations, invoices and reports in one place.</div>
<div class="cards">
<a class="c" href="quotes.html"><b>Quotations</b><span id="sq"></span><i>Open →</i></a>
<a class="c" href="invoices.html"><b>Invoices</b><span id="si"></span><i>Open →</i></a>
<a class="c" href="reports.html"><b>Reports</b><span id="sr"></span><i>Open →</i></a></div>
<div class="k" id="kp"></div>
<div class="box"><b>Backup</b><p>Everything is stored only in this browser. Export a backup regularly, and import it to restore or move to another device.</p><button id="ex">Export all data</button><button id="im">Import backup</button><input type="file" id="imf" accept="application/json" hidden></div>
</div><script>
const KEYS={quotes:'myrmex_standalone_quotes',invoices:'myrmex_invoices',reports:'myrmexReports_v2'};
const rd=k=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}},$=i=>document.getElementById(i);
const kes=n=>'KES '+Math.round(n||0).toLocaleString('en-KE'),sm=(a,f)=>a.reduce((s,x)=>s+(f(x)||0),0);
const Q=rd(KEYS.quotes),I=rd(KEYS.invoices).filter(x=>x.status!=='Void'),R=rd(KEYS.reports);
const od=x=>{const d=new Date(x.date);d.setDate(d.getDate()+(x.validity||14));return x.balance>0&&d<new Date()};
const sent=Q.filter(x=>x.status==='Sent'),O=I.filter(od);
$('sq').textContent=Q.length+' saved · '+sent.length+' awaiting reply';
$('si').textContent=I.length+' saved · '+I.filter(x=>x.balance>0).length+' unpaid';
$('sr').textContent=R.length+' saved';
$('kp').innerHTML=[['Awaiting reply',kes(sm(sent,x=>x.total))],['Outstanding',kes(sm(I,x=>x.balance))],['Overdue',O.length+(O.length?' · '+kes(sm(O,x=>x.balance)):'')],['Collected',kes(sm(I,x=>x.deposit))]].map(a=>`<div>${a[0]}<b>${a[1]}</b></div>`).join('');
$('ex').onclick=()=>{const o={};for(const k in KEYS)o[k]=rd(KEYS[k]);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download='myrmex-hub-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()};
$('im').onclick=()=>$('imf').click();
$('imf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);let n=0;for(const k in KEYS){if(!Array.isArray(o[k]))continue;const l=rd(KEYS[k]);o[k].forEach(x=>{if(!x||x.id==null)return;const i=l.findIndex(y=>y.id===x.id);if(i>=0)l[i]=x;else{l.unshift(x);n++}});localStorage.setItem(KEYS[k],JSON.stringify(l))}alert('Import complete: '+n+' new items added.');location.reload()}catch(x){alert("Couldn't read that file. Use a Myrmex hub backup (.json).")}};r.readAsText(f)};
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
