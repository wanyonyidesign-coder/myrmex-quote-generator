<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Myrmex App</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png" type="image/png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#0A0D0A"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Myrmex">
<style>
:root{--bg:#0A0D0A;--panel:#0E120D;--text:#EEF1EC;--sec:#A9B2A6;--bd:#232922;--brand:#388E3C}
:root[data-theme=light]{--bg:#F4F7F5;--panel:#fff;--text:#1B1F1D;--sec:#4B5A50;--bd:#D7E2DA}
@media(prefers-color-scheme:light){:root:not([data-theme]){--bg:#F4F7F5;--panel:#fff;--text:#1B1F1D;--sec:#4B5A50;--bd:#D7E2DA}}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.app{display:flex;height:100vh;height:100dvh}
aside{width:176px;flex:none;background:var(--panel);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 10px 14px}
aside img{height:30px;width:auto;align-self:flex-start;margin:0 6px 4px}
.tag{font-size:9.5px;font-weight:700;letter-spacing:.12em;color:var(--sec);margin:0 6px 18px}
.grp{font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--sec);margin:12px 8px 4px;opacity:.8}
nav a{display:block;padding:10px 12px;border-radius:8px;color:var(--sec);text-decoration:none;font-size:14px;font-weight:600;margin-bottom:2px}
nav a:hover{color:var(--text)}nav a.on{background:var(--brand);color:#fff}
main{flex:1;min-width:0}iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}
@media(max-width:760px){
 .app{flex-direction:column-reverse}
 aside{width:100%;border-right:0;border-top:1px solid var(--bd);padding:6px 6px max(6px,env(safe-area-inset-bottom))}
 aside img,.tag,.grp{display:none}
 nav{display:flex;gap:2px}nav a{flex:1;text-align:center;padding:9px 2px;font-size:11.5px;margin:0}
}
