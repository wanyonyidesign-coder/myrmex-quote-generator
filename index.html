<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Myrmex — Quotation Generator</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1B5E20">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Myrmex Quotes">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --radius:10px;
  --brand:#1B5E20;--brand-mid:#388E3C;--brand-light:rgba(56,142,60,0.18);
  --text:#EEF1EC;--text-secondary:#A9B2A6;--text-muted:#71796E;
  --border:#232922;--border-strong:#323A2E;
  --surface:#0A0D0A;--panel:#0E120D;--card:#1B1D23;--field:#1C231C;
  --danger:#FF6568;--danger-bg:rgba(255,101,104,0.16);
  --shadow:0 2px 10px rgba(0,0,0,0.35);
}
body{background:var(--surface);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:24px;min-height:100vh}
.wrap{max-width:1200px;margin:0 auto}
.page-title{font-size:22px;font-weight:700;margin-bottom:4px}
.page-logo{height:30px;width:auto;display:block;margin-bottom:8px}
.page-sub{color:var(--text-muted);font-size:13px;margin-bottom:20px}
.page-tagline{color:var(--text-secondary);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:20px}
.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--border)}
.tab{background:none;border:none;color:var(--text-muted);padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent}
.tab.active{color:var(--text);border-bottom-color:var(--brand-mid)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.card-header{padding:.875rem 1.25rem;border-bottom:1px solid var(--border);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-secondary)}
.card-body{padding:1.25rem}
.sub-label{font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-group{display:flex;flex-direction:column;gap:4px;min-width:0}
.form-group label{font-size:11px;color:var(--text-secondary);font-weight:600}
.form-group input,.form-group select,.form-group textarea{
  background:var(--field);border:1px solid var(--border-strong);border-radius:7px;color:var(--text);
  padding:8px 10px;font-size:13px;font-family:inherit;width:100%
}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--brand-mid)}
.form-group input:disabled{opacity:.5}
textarea{resize:vertical}
.item-row{border:1px solid var(--border-strong);border-radius:8px;padding:10px;background:var(--field);margin-bottom:8px}
.item-row-top{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.item-row-top input{flex:1;min-width:0}
.item-row-grid{display:grid;grid-template-columns:64px 1fr 1fr;gap:8px;align-items:end}
.item-field{display:flex;flex-direction:column;gap:4px;min-width:0}
.item-field-label{font-size:9px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em}
.item-line-total{font-size:12.5px;font-weight:700;color:var(--text);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-del{background:var(--danger-bg);color:var(--danger);border:none;border-radius:6px;width:26px;height:26px;flex-shrink:0;cursor:pointer;font-size:15px;line-height:1}
.item-row input{background:var(--card);border:1px solid var(--border-strong);border-radius:6px;color:var(--text);padding:7px 9px;font-size:12.5px;font-family:inherit;width:100%}
.item-row input:focus{outline:none;border-color:var(--brand-mid)}
.item-row input[type=number]{text-align:right}
.inline-btn-outline{background:none;border:1px dashed var(--border-strong);color:var(--text-secondary);border-radius:7px;padding:6px 12px;font-size:12px;cursor:pointer;margin-bottom:14px}
.inline-btn-outline:hover{border-color:var(--brand-mid);color:var(--text)}
.totals-box{background:var(--field);border-radius:8px;padding:10px 14px;margin-bottom:6px}
.total-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-secondary);padding:3px 0}
.total-row.grand{font-size:15px;font-weight:700;color:var(--text);border-top:1px solid var(--border-strong);margin-top:4px;padding-top:8px}
.btn{border:none;border-radius:8px;padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--brand-mid);color:#fff}
.btn-primary:hover{background:#2E7D32}
.btn-secondary{background:var(--field);color:var(--text);border:1px solid var(--border-strong)}
.btn-secondary:hover{border-color:var(--brand-mid)}
.btn-danger{background:var(--danger-bg);color:var(--danger)}
.inline-icon{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7;vertical-align:-2px}
.footer-actions{padding:.875rem 1.25rem;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap}
.collapsible-summary{cursor:pointer;list-style:none;display:block}
.collapsible-summary::-webkit-details-marker{display:none}
.rtable-wrap{overflow-x:auto}
.rtable{width:100%;border-collapse:collapse;font-size:12.5px}
.rtable th{text-align:left;padding:10px 12px;font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border)}
.rtable td{padding:10px 12px;border-bottom:1px solid var(--border)}
.rtable tr:hover td{background:rgba(255,255,255,0.02)}
.status-pill{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em}
.status-Draft{background:rgba(113,121,110,0.2);color:var(--text-muted)}
.status-Sent{background:rgba(91,156,255,0.16);color:#5B9CFF}
.status-Accepted{background:rgba(76,175,80,0.16);color:#4CAF50}
.status-Rejected{background:rgba(255,101,104,0.16);color:#FF6568}
.empty{text-align:center;padding:40px 20px;color:var(--text-muted)}
.row-actions{display:flex;gap:6px}
.icon-btn{background:var(--field);border:1px solid var(--border-strong);border-radius:6px;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-secondary)}
.icon-btn:hover{color:var(--text);border-color:var(--brand-mid)}

/* Quote document (print/PDF layout) */
.q-header{background:var(--brand);padding:22px 28px;display:flex;justify-content:space-between;align-items:flex-start}
.q-co-logo{height:30px;width:auto;display:block;margin-bottom:8px}
.q-co-contact{color:rgba(255,255,255,.75);font-size:11.5px;line-height:1.9;margin-top:12px;font-family:-apple-system,sans-serif;overflow-wrap:break-word;word-break:break-word;max-width:100%}
.q-doc-info{text-align:right;font-family:-apple-system,sans-serif;max-width:100%;min-width:0}
.q-doc-label{font-size:11px;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
.q-doc-num{font-size:20px;font-weight:700;color:#fff;margin-bottom:10px;overflow-wrap:break-word;word-break:break-word}
.q-doc-meta{font-size:11.5px;color:rgba(255,255,255,.7);line-height:2;overflow-wrap:break-word;word-break:break-word}
.q-body{padding:22px 28px;min-width:0;background:#fff;color:#20241f}
.q-to-label{font-size:10px;font-weight:700;color:#71796E;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px;font-family:-apple-system,sans-serif}
.q-to-name{font-size:16px;font-weight:700;font-family:-apple-system,sans-serif;margin-bottom:3px;overflow-wrap:break-word;word-break:break-word}
.q-to-detail{font-size:12.5px;color:#4b544a;line-height:1.8;font-family:-apple-system,sans-serif;margin-bottom:18px;overflow-wrap:break-word;word-break:break-word}
.q-subject-box{background:var(--brand-light);border-left:3px solid var(--brand-mid);padding:8px 12px;border-radius:0 6px 6px 0;margin-bottom:18px;font-family:-apple-system,sans-serif}
.q-subject-lbl{font-size:10px;font-weight:700;color:var(--brand);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
.q-subject-val{font-size:13.5px;font-weight:600;color:var(--brand);overflow-wrap:break-word;word-break:break-word}
.q-table{width:100%;border-collapse:collapse;margin-bottom:16px;font-family:-apple-system,sans-serif;font-size:12.5px;min-width:0;table-layout:fixed}
.q-table th{background:#F3F6F3;padding:8px 10px;text-align:left;font-size:10px;font-weight:700;color:#71796E;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid #e2e6e1;overflow-wrap:break-word;word-break:break-word}
.q-table th:last-child,.q-table td:last-child{text-align:right}
.q-table td{padding:9px 10px;border-bottom:1px solid #F0F0F0;color:#20241f;overflow-wrap:break-word;word-break:break-word}
.q-totals{margin-left:auto;width:220px;max-width:100%;font-family:-apple-system,sans-serif;font-size:12.5px}
.q-tr{display:flex;justify-content:space-between;gap:8px;padding:4px 0;color:#4b544a}
.q-tr span{overflow-wrap:break-word;word-break:break-word}
.q-tr.grand{font-size:15px;font-weight:700;color:var(--brand);border-top:2px solid var(--brand-light);margin-top:5px;padding-top:8px}
.q-bank{margin-top:18px;background:#F5FAF5;border:1px solid var(--brand-light);border-radius:10px;padding:12px 14px;font-family:-apple-system,sans-serif;min-width:0}
.q-bank-lbl{font-size:10px;font-weight:700;color:var(--brand);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}
.q-bank-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px 18px}
.q-bank-item{font-size:11.5px;color:#4b544a;overflow-wrap:break-word;word-break:break-word;min-width:0}
.q-bank-item span{font-weight:600;color:#20241f;display:block;overflow-wrap:break-word;word-break:break-word}
.q-validity{margin-top:12px;font-size:11px;color:#71796E;text-align:center;font-family:-apple-system,sans-serif}
.q-footer{background:#F3F6F3;padding:10px 28px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #e2e6e1;font-family:-apple-system,sans-serif;font-size:11px;color:#71796E;min-width:0}
.q-footer-brand{font-weight:600;color:var(--brand)}
.q-doc{border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}

@media (max-width:900px){
  .cols{grid-template-columns:1fr!important}
}
@media (max-width:700px){
  .form-grid{grid-template-columns:1fr}
  .q-header,.q-body{padding:14px 16px}
  .q-footer{padding:9px 16px;flex-wrap:wrap;gap:4px}
  .q-doc-num{font-size:16px}
  .q-co-contact,.q-doc-meta{font-size:10.5px}
  .q-table th,.q-table td{padding:6px}
  .q-table{font-size:11px}
  .q-bank-grid{grid-template-columns:1fr}
  .q-totals{width:100%}
}
@media print{
  body *{visibility:hidden}
  #quote-preview,#quote-preview *{visibility:visible}
  #quote-preview{position:absolute;top:0;left:0;width:100%}
  .q-header,.q-bank,.q-subject-box,.q-table th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .q-table tr,.q-header,.q-bank,.q-footer{page-break-inside:avoid}
}
</style>
</head>

const STORAGE_KEY = 'myrmex_standalone_quotes';

let items = [{desc:'',qty:1,unit:0}];
let quotes = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let editingId = null;

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function gv(id){const el=document.getElementById(id);return el?(el.value||'').trim():'';}
function fmtDate(d){return d?new Date(d).toLocaleDateString('en-KE',{day:'numeric',month:'long',year:'numeric'}):'';}

function nextQuoteNum(){
  const nums = quotes.map(q => {
    const m = /MYR-(\d+)/.exec(q.num||'');
    return m ? parseInt(m[1],10) : 0;
  });
  const next = (nums.length ? Math.max(...nums) : 0) + 1;
  return 'MYR-' + String(next).padStart(3,'0');
}

function init(){
  document.getElementById('q-date').value = new Date().toISOString().slice(0,10);
  document.getElementById('q-num').value = nextQuoteNum();
  renderItems();
  update();
  renderQuotesList();
}

function addItem(){ items.push({desc:'',qty:1,unit:0}); renderItems(); update(); }
function removeItem(i){ if(items.length===1) return; items.splice(i,1); renderItems(); update(); }

function renderItems(){
  document.getElementById('items-body').innerHTML = items.map((it,i) => `
    <div class="item-row">
      <div class="item-row-top">
        <input value="${esc(it.desc)}" placeholder="Item description" oninput="items[${i}].desc=this.value;update()">
        <button class="btn-del" title="Remove item" onclick="removeItem(${i})">×</button>
      </div>
      <div class="item-row-grid">
        <div class="item-field"><span class="item-field-label">Qty</span><input type="number" value="${it.qty}" min="1" oninput="items[${i}].qty=parseFloat(this.value)||1;updateItemTotal(${i});update()"></div>
        <div class="item-field"><span class="item-field-label">Unit price</span><input type="number" value="${it.unit||''}" placeholder="0" oninput="items[${i}].unit=parseFloat(this.value)||0;updateItemTotal(${i});update()"></div>
        <div class="item-field"><span class="item-field-label">Total</span><div class="item-line-total" id="item-total-${i}">KES ${(it.qty*(it.unit||0)).toLocaleString()}</div></div>
      </div>
    </div>`).join('');
}
function updateItemTotal(i){
  const el = document.getElementById('item-total-'+i);
  if(el) el.textContent = 'KES ' + (items[i].qty*(items[i].unit||0)).toLocaleString();
}

function computeTotals(){
  const sub = items.reduce((a,it) => a + (it.qty*(it.unit||0)), 0);
  const incVat = document.getElementById('q-inc-vat').checked;
  const discountPct = Math.max(0, Math.min(100, parseFloat(gv('q-discount')) || 0));
  const discountAmt = sub * discountPct / 100;
  const taxable = sub - discountAmt;
  const vat = incVat ? taxable * .16 : 0;
  const total = taxable + vat;
  return {sub, incVat, discountPct, discountAmt, vat, total};
}

function update(){
  const {sub, incVat, discountPct, discountAmt, vat, total} = computeTotals();

  document.getElementById('t-sub').textContent = 'KES ' + sub.toLocaleString();
  document.getElementById('t-discount-amt').textContent = '– KES ' + Math.round(discountAmt).toLocaleString() + ' (' + discountPct + '%)';
  document.getElementById('t-discount-row').style.display = discountPct > 0 ? 'flex' : 'none';
  document.getElementById('t-vat').textContent = 'KES ' + Math.round(vat).toLocaleString();
  document.getElementById('t-vat-row').style.display = incVat ? 'flex' : 'none';
  document.getElementById('t-total').textContent = 'KES ' + Math.round(total).toLocaleString();

  document.getElementById('quote-preview').innerHTML = buildQuoteHTML(collectForm());
}

function collectForm(){
  const {sub, incVat, discountPct, discountAmt, vat, total} = computeTotals();
  return {
    num: gv('q-num') || 'MYR-001',
    date: gv('q-date'),
    client: gv('q-client'),
    phone: gv('q-phone'),
    email: gv('q-email'),
    location: gv('q-location'),
    division: gv('q-division'),
    subject: gv('q-subject'),
    notes: gv('q-notes'),
    discountPct, discountAmt: Math.round(discountAmt),
    terms: gv('q-terms'),
    incVat,
    items: items.map(it => ({...it})),
    subtotal: sub, vat: Math.round(vat), total: Math.round(total),
    preparedBy: gv('q-preparedby') || 'David B. Wanyonyi'
  };
}

function buildQuoteHTML(q){
  const its = q.items || [];
  let validTil = '';
  if(q.date){
    const vd = new Date(q.date); vd.setDate(vd.getDate()+30);
    validTil = vd.toLocaleDateString('en-KE',{day:'numeric',month:'long',year:'numeric'});
  }
  return `
    <div class="q-header">
      <div><img class="q-co-logo" src="${LOGO}" alt="Myrmex Property Maintenance">
        <div class="q-co-contact">+254 704 184 932 / +254 756 915 091<br>myrmexpropertymaintenance@gmail.com<br>myrmex.co.ke<br>Nairobi, Kenya</div>
      </div>
      <div class="q-doc-info"><div class="q-doc-label">Quotation</div><div class="q-doc-num">${esc(q.num)}</div>
        <div class="q-doc-meta">Date: ${fmtDate(q.date)||'—'}<br>Division: ${esc(q.division)}${validTil?'<br>Valid until: '+validTil:''}</div>
      </div>
    </div>
    <div class="q-body">
      <div class="q-to-label">Prepared for</div>
      <div class="q-to-name">${esc(q.client)||'Client Name'}</div>
      <div class="q-to-detail">${q.phone?esc(q.phone)+'<br>':''}${q.email?esc(q.email)+'<br>':''}${q.location?esc(q.location):''}</div>
      <div class="q-subject-box"><div class="q-subject-lbl">Subject</div><div class="q-subject-val">${esc(q.subject)||'Technical Services Quotation'}</div></div>
      <table class="q-table">
        <thead><tr><th style="width:48%">Description</th><th style="width:10%;text-align:center">Qty</th><th style="width:20%;text-align:right">Unit price</th><th style="width:22%;text-align:right">Total</th></tr></thead>
        <tbody>${its.map(it => `<tr><td style="font-weight:600">${esc(it.desc)||'Item'}</td><td style="text-align:center">${it.qty}</td><td style="text-align:right">KES ${(it.unit||0).toLocaleString()}</td><td style="text-align:right;font-weight:600">KES ${(it.qty*(it.unit||0)).toLocaleString()}</td></tr>`).join('')}</tbody>
      </table>
      <div style="display:flex;justify-content:flex-end">
        <div class="q-totals">
          <div class="q-tr"><span>Subtotal</span><span>KES ${(q.subtotal||0).toLocaleString()}</span></div>
          ${(q.discountPct||0)>0?'<div class="q-tr"><span>Discount ('+q.discountPct+'%)</span><span>– KES '+Math.round(q.discountAmt||0).toLocaleString()+'</span></div>':''}
          ${q.incVat?'<div class="q-tr"><span>VAT (16%)</span><span>KES '+Math.round(q.vat||0).toLocaleString()+'</span></div>':''}
          <div class="q-tr grand"><span>Total</span><span>KES ${Math.round(q.total||0).toLocaleString()}</span></div>
        </div>
      </div>
      ${q.notes?'<div style="margin-top:16px"><div class="q-bank-lbl" style="margin-bottom:5px">Notes &amp; scope</div><div style="font-size:11px;color:#4b544a;line-height:1.7;white-space:pre-wrap">'+esc(q.notes)+'</div></div>':''}
      <div class="q-bank"><div class="q-bank-lbl">Payment details</div>
        <div class="q-bank-grid">
          <div class="q-bank-item">Paybill number<span>542542</span></div>
          <div class="q-bank-item">Account number<span>03108544206150</span></div>
          <div class="q-bank-item">Reference<span>${esc(q.num)}</span></div>
        </div>
      </div>
      ${validTil?'<div class="q-validity">This quotation is valid for 30 days — until '+validTil+'.</div>':''}
    </div>
    <div class="q-footer"><div>Prepared by: <strong>${esc(q.preparedBy)}</strong></div><div class="q-footer-brand">myrmex.co.ke</div></div>
  `;
}

function saveDraft(){
  const q = collectForm();
  if(!q.client){ alert('Add a client name before saving.'); return; }
  q.id = editingId || Date.now();
  q.status = q.status || 'Draft';
  const idx = quotes.findIndex(x => x.id === q.id);
  if(idx >= 0) quotes[idx] = {...quotes[idx], ...q};
  else quotes.push(q);
  editingId = q.id;
  persist();
  renderQuotesList();
  alert('Quotation ' + q.num + ' saved.');
}

function persist(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(quotes));
}

function resetForm(){
  if(!confirm('Reset the quotation form?')) return;
  document.getElementById('q-num').value = nextQuoteNum();
  document.getElementById('q-date').value = new Date().toISOString().slice(0,10);
  ['q-client','q-phone','q-email','q-location','q-subject','q-notes'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('q-division').value = 'Power Solutions';
  document.getElementById('q-inc-vat').checked = false;
  document.getElementById('q-discount').value = '0';
  document.getElementById('q-terms').value = 'Standard (50% deposit, balance on completion)';
  document.getElementById('q-preparedby').value = 'David B. Wanyonyi';
  items = [{desc:'',qty:1,unit:0}];
  editingId = null;
  renderItems();
  update();
}

function switchTab(tab, btn){
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-new').style.display = tab === 'new' ? 'grid' : 'none';
  document.getElementById('tab-list').style.display = tab === 'list' ? 'block' : 'none';
  if(tab === 'list') renderQuotesList();
}

function statusPill(s){
  return `<span class="status-pill status-${s}">${s}</span>`;
}

function renderQuotesList(){
  const tbody = document.getElementById('quotes-tbody');
  const empty = document.getElementById('quotes-empty');
  document.getElementById('list-count').textContent = quotes.length ? '(' + quotes.length + ')' : '';
  if(!quotes.length){
    tbody.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  tbody.innerHTML = quotes.slice().reverse().map(q => `
    <tr>
      <td>${esc(q.num)}</td>
      <td>${esc(q.client)}</td>
      <td>${esc(q.subject)||'—'}</td>
      <td>${(q.total||0).toLocaleString()}</td>
      <td>${statusPill(q.status||'Draft')}</td>
      <td>${fmtDate(q.date)}</td>
      <td class="row-actions">
        <button class="icon-btn" title="Edit" onclick="loadQuote(${q.id})">✎</button>
        <button class="icon-btn" title="Duplicate" onclick="duplicateQuote(${q.id})">⧉</button>
        <button class="icon-btn" title="Delete" onclick="deleteQuote(${q.id})">🗑</button>
      </td>
    </tr>`).join('');
}

function loadQuote(id){
  const q = quotes.find(x => x.id === id);
  if(!q) return;
  editingId = q.id;
  document.getElementById('q-num').value = q.num || '';
  document.getElementById('q-date').value = q.date || '';
  document.getElementById('q-client').value = q.client || '';
  document.getElementById('q-phone').value = q.phone || '';
  document.getElementById('q-email').value = q.email || '';
  document.getElementById('q-location').value = q.location || '';
  document.getElementById('q-division').value = q.division || 'Power Solutions';
  document.getElementById('q-subject').value = q.subject || '';
  document.getElementById('q-notes').value = q.notes || '';
  document.getElementById('q-inc-vat').checked = !!q.incVat;
  document.getElementById('q-discount').value = q.discountPct || 0;
  document.getElementById('q-terms').value = q.terms || 'Standard (50% deposit, balance on completion)';
  document.getElementById('q-preparedby').value = q.preparedBy || 'David B. Wanyonyi';
  items = (q.items && q.items.length) ? q.items.map(it => ({...it})) : [{desc:'',qty:1,unit:0}];
  renderItems();
  update();
  document.querySelector('.tab[data-tab="new"]').click();
}

function duplicateQuote(id){
  const q = quotes.find(x => x.id === id);
  if(!q) return;
  const copy = {...q, id: Date.now(), num: nextQuoteNum(), status: 'Draft'};
  quotes.push(copy);
  persist();
  renderQuotesList();
}

function deleteQuote(id){
  if(!confirm('Delete this quotation?')) return;
  quotes = quotes.filter(x => x.id !== id);
  persist();
  renderQuotesList();
}

init();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW registration failed', err));
  });
}
</script>
</body>
</html>
