:root{
  --m-bg:#f4f7f5; --m-card:#ffffff; --m-field:#f4f7f5; --m-border:#d7e2da;
  --m-ink:#1b1f1d; --m-muted:#5b6b60; --m-muted2:#8a978d;
  --m-green:#1f7a3d; --m-green-dark:#155c2c; --m-green-light:#e8f4ec;
  --m-danger:#c0392b; --m-gauge:#e2e8e4;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --m-bg:#121712; --m-card:#182019; --m-field:#121712; --m-border:#2c3b31;
    --m-ink:#eef1ef; --m-muted:#a9b6ae; --m-muted2:#7d8d83;
    --m-green:#2a8f4e; --m-green-dark:#6fcf91; --m-green-light:#183524;
    --m-danger:#e0685b; --m-gauge:#26332a;
  }
}
:root[data-theme="dark"]{
    --m-bg:#121712; --m-card:#182019; --m-field:#121712; --m-border:#2c3b31;
    --m-ink:#eef1ef; --m-muted:#a9b6ae; --m-muted2:#7d8d83;
    --m-green:#2a8f4e; --m-green-dark:#6fcf91; --m-green-light:#183524;
    --m-danger:#e0685b; --m-gauge:#26332a;
    color-scheme: dark;
}
:root[data-theme="light"]{ color-scheme: light; }
html,body{margin:0;padding:0;background:var(--m-bg);}
body{min-height:100vh;min-height:100dvh;font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;color:var(--m-ink);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
.m-shell{max-width:1080px;margin:0 auto;padding:20px 14px 40px;box-sizing:border-box;}
.m-shell *{box-sizing:border-box;}
.m-brandbar{background:#fff;border-radius:10px;padding:14px 20px 12px;margin-bottom:14px;border:1px solid var(--m-border);
  border-bottom:3px solid var(--m-green);display:flex;flex-direction:column;align-items:center;text-align:center;}
.m-brandbar img{max-width:220px;width:100%;height:auto;display:block;}
.m-brandbar p{margin:6px 0 0;font-size:1rem;letter-spacing:1px;text-transform:uppercase;color:#155c2c;font-weight:700;}
.m-back{margin:0 0 10px;font-size:.9rem;font-weight:600;}
.m-back a{color:var(--m-green-dark);text-decoration:none;}
.m-back a:hover{text-decoration:underline;}
.m-apps{margin-top:28px;}
.m-apps-label{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--m-green-dark);
  border-bottom:1px solid var(--m-border);padding-bottom:4px;margin-bottom:12px;}
.m-apps-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:600px){.m-apps-grid{grid-template-columns:1fr;}}
.m-app{display:flex;flex-direction:column;gap:6px;background:var(--m-card);border:1px solid var(--m-border);border-left:4px solid var(--m-green);
  border-radius:10px;padding:14px 16px;text-decoration:none;color:var(--m-ink);}
.m-app:hover{border-color:var(--m-green);}
.m-app b{font-size:1rem;color:var(--m-green-dark);}
.m-app span{font-size:.88rem;color:var(--m-muted);line-height:1.4;}
.m-app i{font-style:normal;font-weight:700;font-size:.85rem;color:var(--m-green);margin-top:2px;}
.m-foot{text-align:center;font-size:.75rem;color:var(--m-muted2);margin:22px 0 0;line-height:1.5;}
.m-theme{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:50;display:flex;
  background:var(--m-card);border:1px solid var(--m-border);border-radius:999px;padding:3px;box-shadow:0 2px 10px rgba(0,0,0,.18);}
.m-theme button{appearance:none;border:0;background:transparent;color:var(--m-muted);font:600 12px Calibri,Candara,"Segoe UI",Arial,sans-serif;
  min-height:36px;min-width:44px;padding:0 10px;border-radius:999px;cursor:pointer;}
.m-theme button[aria-pressed="true"]{background:var(--m-green);color:#fff;}
.m-theme button:focus-visible{outline:2px solid var(--m-green-dark);outline-offset:1px;}
.m-shell{padding-bottom:calc(40px + 56px);}
@media (max-width:600px){
  .m-shell{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));}
  input[type="number"]:not(.sbs-watt-input):not(.sbs-hours-input):not(.uc-watt-input),select,textarea{font-size:16px;}
}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}

        .sbs-page{--bg:var(--m-bg);--panel:var(--m-card);--panel-2:var(--m-field);--border:var(--m-border);--amber:var(--m-green);--teal:var(--m-green-dark);--danger:var(--m-danger);--text:var(--m-ink);--muted:var(--m-muted);--muted-2:var(--m-muted2);
          background:var(--bg);color:var(--text);font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;padding:6px 0 10px;border-radius:16px;}

        .sbs-eyebrow{font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);display:flex;align-items:center;gap:8px;margin-bottom:10px;}

        .sbs-sub{color:var(--muted);font-size:15px;max-width:600px;margin:0 0 32px;line-height:1.5;}
        .sbs-grid{display:grid;grid-template-columns:1.05fr 0.95fr;gap:20px;align-items:start;}
        @media (max-width:820px){.sbs-grid{grid-template-columns:1fr;}}
        .sbs-panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:24px;}
        .sbs-panel-label{font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);margin-bottom:16px;}

        .sbs-appliance-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--border);}

        .sbs-appliance-info{display:flex;flex-direction:column;gap:2px;}
        .sbs-appliance-label{font-size:13.5px;color:var(--text);}

        .sbs-qty{display:flex;align-items:center;gap:6px;}
        .sbs-qty-btn{width:26px;height:26px;border-radius:6px;background:var(--panel-2);border:1px solid var(--border);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;user-select:none;}
        .sbs-qty-btn:hover{border-color:var(--teal);color:var(--text);}
        .sbs-qty-val{width:22px;text-align:center;font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;font-size:13px;color:var(--text);}
        .sbs-appliance-watt-edit{display:flex;align-items:center;gap:5px;font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;font-size:10.5px;color:var(--muted-2);flex-wrap:wrap;}
        .sbs-watt-input{width:52px;background:var(--panel-2);border:1px solid var(--border);color:var(--text);font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;font-size:11px;padding:4px 6px;border-radius:5px;outline:none;}
        .sbs-watt-input:focus{border-color:var(--teal);}
        .sbs-hours-input{width:38px;background:var(--panel-2);border:1px solid var(--border);color:var(--text);font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;font-size:11px;padding:4px 6px;border-radius:5px;outline:none;}
        .sbs-hours-input:focus{border-color:var(--teal);}
        .sbs-custom-info{gap:5px;}
        .sbs-custom-name{background:var(--panel-2);border:1px solid var(--border);color:var(--text);font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;font-size:13px;padding:5px 8px;border-radius:6px;outline:none;width:140px;}
        .sbs-custom-name:focus{border-color:var(--teal);}
        .sbs-remove-btn{width:22px;height:22px;border-radius:6px;background:var(--panel-2);border:1px solid var(--border);color:var(--muted-2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px;margin-left:4px;}
        .sbs-remove-btn:hover{border-color:var(--danger);color:var(--danger);}
        .sbs-add-custom{margin-top:10px;padding:9px 12px;border:1px dashed var(--border);border-radius:8px;color:var(--muted);font-size:12.5px;text-align:center;cursor:pointer;}
        .sbs-add-custom:hover{border-color:var(--teal);color:var(--teal);}
        .sbs-hint-block{margin-top:12px;font-size:11px;color:var(--muted-2);line-height:1.5;}

        .sbs-category-count{font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;text-transform:none;letter-spacing:normal;color:var(--muted-2);font-size:10.5px;}
        .sbs-field{margin-bottom:16px;}

        .sbs-field input:focus{border-color:var(--teal);}

        .sbs-toggle-btn.active{background:rgba(31,122,61,0.12);border-color:var(--amber);color:var(--amber);}
        .sbs-mode-hint{font-size:11px;color:var(--muted-2);margin-top:6px;}

        .sbs-headline-sub{font-size:12.5px;color:var(--muted-2);margin-top:6px;}

        .uc-qty{display:flex;align-items:center;gap:6px;}

        .uc-add-custom:hover{border-color:var(--teal);color:var(--teal);}
        .uc-hint-block{margin-top:12px;font-size:11px;color:var(--muted-2);line-height:1.5;}
        .uc-load-summary{margin-top:14px;padding:10px 12px;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;}
        .uc-load-summary strong{color:var(--text);font-weight:600;}

        .uc-readout{font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;}

        .uc-headline-unit{font-size:15px;color:var(--muted);font-weight:500;}

        .uc-btn-ghost{background:transparent;border-color:var(--border);color:var(--muted);}

        .vdc-page{--bg:var(--m-bg);--panel:var(--m-card);--panel-2:var(--m-field);--border:var(--m-border);--amber:var(--m-green);--teal:var(--m-green-dark);--danger:var(--m-danger);--text:var(--m-ink);--muted:var(--m-muted);--muted-2:var(--m-muted2);
          background:var(--bg);color:var(--text);font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;padding:6px 0 10px;border-radius:16px;}
        .vdc-page *{box-sizing:border-box;}

        .vdc-eyebrow{font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);display:flex;align-items:center;gap:8px;margin-bottom:10px;}
        .vdc-rec-dot{width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber);animation:vdcBlink 1.6s infinite;}
        @keyframes vdcBlink{0%,45%{opacity:1;}50%,95%{opacity:.25;}100%{opacity:1;}}
        .vdc-h1{font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;font-weight:600;font-size:clamp(26px,4vw,36px);line-height:1.15;margin:0 0 8px;letter-spacing:-0.01em;}
        .vdc-sub{color:var(--muted);font-size:15px;max-width:580px;margin:0 0 32px;line-height:1.5;}
        .vdc-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
        @media (max-width:760px){.vdc-grid{grid-template-columns:1fr;}}
        .vdc-panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:24px;}
        .vdc-panel-label{font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);margin-bottom:18px;}
        .vdc-field{margin-bottom:18px;}
        .vdc-field:last-child{margin-bottom:0;}
        .vdc-field label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:7px;}
        .vdc-field input[type="number"]{width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;font-size:14.5px;padding:10px 12px;border-radius:8px;outline:none;}
        .vdc-field input:focus{border-color:var(--teal);}
        .vdc-hint{font-size:11.5px;color:var(--muted-2);margin-top:6px;}
        .vdc-row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
        .vdc-toggle-group{display:flex;gap:8px;flex-wrap:wrap;}
        .vdc-toggle-btn{flex:1;min-width:90px;background:var(--panel-2);border:1px solid var(--border);color:var(--muted);font-size:12.5px;font-weight:500;padding:9px 8px;border-radius:8px;cursor:pointer;text-align:center;}
        .vdc-toggle-btn.active{background:rgba(31,122,61,0.12);border-color:var(--amber);color:var(--amber);}
        .vdc-result-panel{background:linear-gradient(165deg,var(--panel) 0%,var(--m-bg) 100%);border:1px solid var(--border);border-radius:10px;padding:24px;display:flex;flex-direction:column;}
        .vdc-readout{font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;}
        .vdc-headline-figure{font-size:44px;font-weight:700;line-height:1;color:var(--text);margin:4px 0 2px;}
        .vdc-headline-unit{font-size:16px;color:var(--muted);font-weight:500;}
        .vdc-headline-sub{font-size:12.5px;color:var(--muted-2);margin-top:6px;}
        .vdc-gauge-wrap{margin:22px 0 20px;}
        .vdc-gauge-meta{display:flex;justify-content:space-between;font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;font-size:11.5px;color:var(--muted);margin-bottom:8px;}
        .vdc-status-ok{color:var(--teal);}
        .vdc-status-warn{color:var(--danger);}
        .vdc-gauge-track{width:100%;height:14px;background:var(--panel-2);border:1px solid var(--border);border-radius:7px;overflow:hidden;display:flex;gap:2px;padding:2px;}
        .vdc-gauge-seg{flex:1;background:var(--m-gauge);border-radius:2px;}
        .vdc-gauge-seg.filled-ok{background:var(--teal);}
        .vdc-gauge-seg.filled-warn{background:var(--danger);}
        .vdc-stat-line{display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-top:1px solid var(--border);font-size:13.5px;}
        .vdc-stat-line .k{color:var(--muted);}
        .vdc-stat-line .v{font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;color:var(--text);font-weight:500;}
        .vdc-recommendation{margin-top:16px;padding:14px 16px;border-radius:10px;background:rgba(31,122,61,0.08);border:1px solid rgba(31,122,61,0.3);font-size:12.5px;line-height:1.6;color:var(--text);}
        .vdc-recommendation-label{font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin-bottom:6px;}
        .vdc-warnings{margin-top:12px;display:flex;flex-direction:column;gap:6px;}
        .vdc-warning-item{font-size:12px;line-height:1.5;color:var(--m-danger);padding:9px 12px;border-radius:8px;background:rgba(192,57,43,0.08);border:1px solid rgba(192,57,43,0.3);}
        .vdc-cta{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap;}
        .vdc-btn{font-weight:600;font-size:14px;padding:12px 18px;border-radius:8px;text-decoration:none;display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:1px solid transparent;}
        .vdc-btn-primary{background:var(--amber);color:#ffffff;}
        .vdc-btn-ghost{background:transparent;border-color:var(--border);color:var(--muted);}
        .vdc-footnote{margin-top:28px;font-size:12px;color:var(--muted-2);line-height:1.6;max-width:640px;}

        .cctv-field select:focus,.cctv-field input:focus{border-color:var(--teal);}
        .cctv-row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

        .cctv-toggle-btn{flex:1;min-width:110px;background:var(--panel-2);border:1px solid var(--border);color:var(--muted);font-size:12.5px;font-weight:500;padding:9px 8px;border-radius:8px;cursor:pointer;text-align:center;}

        .cctv-result-panel{background:linear-gradient(165deg,var(--panel) 0%,var(--m-bg) 100%);border:1px solid var(--border);border-radius:10px;padding:24px;display:flex;flex-direction:column;}

        .cctv-headline-unit{font-size:16px;color:var(--muted);font-weight:500;}

        .cctv-drive-name{color:var(--amber);}

        .cctv-gauge-seg{flex:1;background:var(--m-gauge);border-radius:2px;}
        .cctv-gauge-seg.filled{background:var(--amber);}
        .cctv-gauge-seg.filled.warn{background:var(--danger);}
        .cctv-stat-line{display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-top:1px solid var(--border);font-size:13.5px;}
        .cctv-stat-line .k{color:var(--muted);}
        .cctv-stat-line .v{font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;color:var(--text);font-weight:500;}
        .cctv-cta{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap;}
        .cctv-btn{font-weight:600;font-size:14px;padding:12px 18px;border-radius:8px;text-decoration:none;display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:1px solid transparent;}

        .cctv-btn-ghost{background:transparent;border-color:var(--border);color:var(--muted);}
        .cctv-footnote{margin-top:28px;font-size:12px;color:var(--muted-2);line-height:1.6;max-width:640px;}
        .cctv-hint{font-size:11.5px;color:var(--muted-2);margin-top:6px;}

        .ccc-page{--bg:var(--m-bg);--panel:var(--m-card);--panel-2:var(--m-field);--border:var(--m-border);--amber:var(--m-green);--teal:var(--m-green-dark);--danger:var(--m-danger);--text:var(--m-ink);--muted:var(--m-muted);--muted-2:var(--m-muted2);
          background:var(--bg);color:var(--text);font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;padding:6px 0 10px;border-radius:16px;}

        .ccc-eyebrow{font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);display:flex;align-items:center;gap:8px;margin-bottom:10px;}
        .ccc-rec-dot{width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber);animation:cccBlink 1.6s infinite;}

        .ccc-h1{font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;font-weight:600;font-size:clamp(26px,4vw,36px);line-height:1.15;margin:0 0 8px;letter-spacing:-0.01em;}
        .ccc-sub{color:var(--muted);font-size:15px;max-width:580px;margin:0 0 20px;line-height:1.5;}
        .ccc-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
        @media (max-width:760px){.ccc-grid{grid-template-columns:1fr;}}
        .ccc-panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:24px;}
        .ccc-panel-label{font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);margin-bottom:18px;}
        .ccc-field{margin-bottom:18px;}
        .ccc-field:last-child{margin-bottom:0;}
        .ccc-field label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:7px;}
        .ccc-field input[type="number"],.ccc-field select{width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;font-size:14.5px;padding:10px 12px;border-radius:8px;outline:none;}
        .ccc-field input:focus,.ccc-field select:focus{border-color:var(--teal);}
        .ccc-presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
        .ccc-preset-btn{background:var(--panel-2);border:1px solid var(--border);color:var(--muted-2);font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;font-size:11px;padding:5px 9px;border-radius:6px;cursor:pointer;}
        .ccc-preset-btn:hover{color:var(--text);border-color:var(--teal);}
        .ccc-toggle-group{display:flex;gap:8px;flex-wrap:wrap;}
        .ccc-toggle-btn{flex:1;min-width:80px;background:var(--panel-2);border:1px solid var(--border);color:var(--muted);font-size:12.5px;font-weight:500;padding:9px 8px;border-radius:8px;cursor:pointer;text-align:center;}
        .ccc-toggle-btn.active{background:rgba(31,122,61,0.12);border-color:var(--amber);color:var(--amber);}
        .ccc-goal-btn{display:flex;flex-direction:column;gap:2px;flex:1;min-width:110px;background:var(--panel-2);border:1px solid var(--border);color:var(--muted);padding:9px 10px;border-radius:8px;cursor:pointer;}
        .ccc-goal-btn.active{background:rgba(31,122,61,0.12);border-color:var(--amber);}

        .ccc-goal-label{font-size:12.5px;font-weight:600;}
        .ccc-goal-hint{font-size:10.5px;color:var(--muted-2);}
        .ccc-result-panel{background:linear-gradient(165deg,var(--panel) 0%,var(--m-bg) 100%);border:1px solid var(--border);border-radius:10px;padding:24px;display:flex;flex-direction:column;}
        .ccc-readout{font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;}
        .ccc-headline-figure{font-size:40px;font-weight:700;line-height:1;color:var(--text);margin:4px 0 2px;}
        .ccc-headline-unit{font-size:15px;color:var(--muted);font-weight:500;}
        .ccc-headline-sub{font-size:12.5px;color:var(--muted-2);margin-top:6px;}
        .ccc-gauge-wrap{margin:22px 0 20px;}
        .ccc-gauge-meta{display:flex;justify-content:space-between;font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;font-size:11.5px;color:var(--muted);margin-bottom:8px;}
        .ccc-gauge-track{width:100%;height:14px;background:var(--panel-2);border:1px solid var(--border);border-radius:7px;overflow:hidden;display:flex;gap:2px;padding:2px;}
        .ccc-gauge-seg{flex:1;background:var(--m-gauge);border-radius:2px;}
        .ccc-gauge-seg.filled{background:var(--teal);}
        .ccc-stat-line{display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-top:1px solid var(--border);font-size:13.5px;}
        .ccc-stat-line .k{color:var(--muted);}
        .ccc-stat-line .v{font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;color:var(--text);font-weight:500;}
        .ccc-cta{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap;}
        .ccc-btn{font-weight:600;font-size:14px;padding:12px 18px;border-radius:8px;text-decoration:none;display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:1px solid transparent;}
        .ccc-btn-primary{background:var(--amber);color:#ffffff;}
        .ccc-btn-ghost{background:transparent;border-color:var(--border);color:var(--muted);}
        .ccc-footnote{margin-top:28px;font-size:12px;color:var(--muted-2);line-height:1.6;max-width:640px;}

        .ccc-preset-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;}
        .ccc-preset-chip{background:var(--panel-2);border:1px solid var(--border);color:var(--muted);font-size:12px;font-weight:500;padding:8px 12px;border-radius:999px;cursor:pointer;}
        .ccc-preset-chip:hover{border-color:var(--teal);color:var(--text);}

        .ccc-lens-blurb{font-size:11.5px;color:var(--muted-2);line-height:1.5;margin-bottom:16px;}

        .ccc-diagram-wrap{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:12px;margin:18px 0;}
        .ccc-diagram-label{font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);margin-bottom:6px;}

        .ccc-dori-dist{font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;color:var(--muted);}
        .ccc-dori-row.active-goal .ccc-dori-dist{color:var(--amber);}

        .wfc-page{--bg:var(--m-bg);--panel:var(--m-card);--panel-2:var(--m-field);--border:var(--m-border);--amber:var(--m-green);--teal:var(--m-green-dark);--danger:var(--m-danger);--text:var(--m-ink);--muted:var(--m-muted);--muted-2:var(--m-muted2);
          background:var(--bg);color:var(--text);font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;padding:6px 0 10px;border-radius:16px;}

        .wfc-eyebrow{font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);display:flex;align-items:center;gap:8px;margin-bottom:10px;}
        .wfc-rec-dot{width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber);animation:wfcBlink 1.6s infinite;}
        @keyframes wfcBlink{0%,45%{opacity:1;}50%,95%{opacity:.25;}100%{opacity:1;}}
        .wfc-h1{font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;font-weight:600;font-size:clamp(26px,4vw,36px);line-height:1.15;margin:0 0 8px;letter-spacing:-0.01em;}
        .wfc-sub{color:var(--muted);font-size:15px;max-width:600px;margin:0 0 28px;line-height:1.5;}
        .wfc-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
        @media (max-width:760px){.wfc-grid{grid-template-columns:1fr;}}
        .wfc-panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:24px;}
        .wfc-panel-label{font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);margin-bottom:16px;}
        .wfc-field{margin-bottom:16px;}
        .wfc-field:last-child{margin-bottom:0;}
        .wfc-field label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:7px;}
        .wfc-field input[type="number"],.wfc-field select{width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;font-size:14.5px;padding:10px 12px;border-radius:8px;outline:none;}
        .wfc-field input:focus,.wfc-field select:focus{border-color:var(--teal);}
        .wfc-hint{font-size:11.5px;color:var(--muted-2);margin-top:6px;}
        .wfc-row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
        .wfc-toggle-group{display:flex;gap:8px;flex-wrap:wrap;}
        .wfc-toggle-btn{flex:1;min-width:90px;background:var(--panel-2);border:1px solid var(--border);color:var(--muted);font-size:12.5px;font-weight:500;padding:9px 8px;border-radius:8px;cursor:pointer;text-align:center;}
        .wfc-toggle-btn.active{background:rgba(31,122,61,0.12);border-color:var(--amber);color:var(--amber);}
        .wfc-mini-label{font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2);margin:18px 0 8px;}
        .wfc-mini-label:first-child{margin-top:0;}

        .wfc-advanced-toggle{font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;font-size:11.5px;color:var(--teal);cursor:pointer;display:inline-block;margin-top:6px;}
        .wfc-advanced-box{margin-top:12px;padding:14px;border-radius:10px;background:var(--panel-2);border:1px solid var(--border);}

        .wfc-result-panel{background:linear-gradient(165deg,var(--panel) 0%,var(--m-bg) 100%);border:1px solid var(--border);border-radius:10px;padding:24px;display:flex;flex-direction:column;}
        .wfc-top-row{display:flex;gap:20px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
        .wfc-readout{font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;}
        .wfc-headline-figure{font-size:40px;font-weight:700;line-height:1;color:var(--text);margin:4px 0 2px;}
        .wfc-headline-unit{font-size:15px;color:var(--muted);font-weight:500;}
        .wfc-headline-sub{font-size:12.5px;color:var(--muted-2);margin-top:6px;}

        .wfc-score-wrap{position:relative;width:100px;height:100px;flex-shrink:0;}
        .wfc-score-figure{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
        .wfc-score-num{font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;font-size:22px;font-weight:700;color:var(--text);}
        .wfc-score-label{font-size:9px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.05em;}

        .wfc-meter{display:flex;gap:4px;margin:16px 0;}
        .wfc-meter-zone{flex:1;text-align:center;padding:8px 4px;border-radius:8px;background:var(--panel-2);border:1px solid var(--border);font-size:10.5px;color:var(--muted-2);font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;text-transform:uppercase;letter-spacing:.05em;}
        .wfc-meter-zone.active{background:rgba(31,122,61,0.15);border-color:var(--amber);color:var(--amber);font-weight:700;}

        .wfc-dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0;}
        .wfc-dash-card{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;}
        .wfc-dash-card .k{font-size:10.5px;color:var(--muted-2);margin-bottom:4px;}
        .wfc-dash-card .v{font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;font-size:15px;color:var(--text);font-weight:700;}

        .wfc-rec-card{margin:16px 0;padding:14px 16px;border-radius:10px;background:rgba(31,122,61,0.08);border:1px solid rgba(31,122,61,0.3);font-size:12.5px;line-height:1.6;color:var(--text);}
        .wfc-rec-card-label{font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin-bottom:6px;}

        .wfc-diagram-wrap{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:12px;margin:16px 0;}
        .wfc-diagram-label{font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);margin-bottom:6px;}

        .wfc-tier-card{margin:16px 0;padding:14px 16px;border-radius:10px;background:var(--panel-2);border:1px solid var(--border);}
        .wfc-tier-name{font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;font-weight:600;font-size:14px;color:var(--amber);margin-bottom:8px;}
        .wfc-tier-list{margin:0;padding-left:16px;font-size:12px;color:var(--muted);line-height:1.7;}

        .wfc-stat-line{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-top:1px solid var(--border);font-size:13px;}
        .wfc-stat-line .k{color:var(--muted);}
        .wfc-stat-line .v{font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;color:var(--text);font-weight:500;}

        .wfc-tech-notes{margin-top:16px;font-size:11.5px;color:var(--muted-2);line-height:1.7;}
        .wfc-tech-notes summary{cursor:pointer;font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;font-size:11px;color:var(--teal);text-transform:uppercase;letter-spacing:.06em;}
        .wfc-tech-notes ul{margin:8px 0 0;padding-left:16px;}

        .wfc-cta{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap;}
        .wfc-btn{font-weight:600;font-size:14px;padding:12px 18px;border-radius:8px;text-decoration:none;display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:1px solid transparent;}
        .wfc-btn-primary{background:var(--amber);color:#ffffff;}

        .mpb-result-panel{background:linear-gradient(165deg,var(--panel) 0%,var(--m-bg) 100%);border:1px solid var(--border);border-radius:10px;padding:24px;}
        .mpb-headline-sub{font-size:12.5px;color:var(--muted-2);margin:6px 0 20px;}

        .mpb-priority-badge{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:8px 12px;border-radius:8px;margin-bottom:8px;background:var(--panel-2);border:1px solid var(--border);color:var(--text);}
        .mpb-priority-note{font-size:12px;color:var(--muted-2);line-height:1.5;margin-bottom:18px;}

        .mpb-stat-line{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-top:1px solid var(--border);font-size:13px;}
        .mpb-stat-line .k{color:var(--muted);}

        .mpb-system-breakdown{display:flex;flex-direction:column;gap:10px;margin:16px 0 20px;}
        .mpb-system-card{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;}
        .mpb-system-card-title{font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;font-weight:600;font-size:13px;margin-bottom:8px;}
        .mpb-visit-group{padding:6px 0;border-top:1px solid var(--border);}
        .mpb-visit-group:first-of-type{border-top:none;padding-top:0;}
        .mpb-visit-group-head{display:flex;justify-content:space-between;font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;font-size:11.5px;color:var(--amber);margin-bottom:3px;}
        .mpb-visit-count{color:var(--amber);}
        .mpb-visit-group-tasks{font-size:12px;color:var(--muted);line-height:1.4;}

        .mpb-bumped-tag{color:var(--amber);font-weight:700;}
        .mpb-reduced-tag{color:var(--teal);font-weight:700;}
        .mpb-empty{color:var(--muted-2);font-size:13px;padding:20px 0;text-align:center;}

        .mpb-note-block{margin-top:16px;padding:12px 14px;border-radius:8px;font-size:12.5px;line-height:1.5;border:1px solid var(--border);background:var(--panel-2);color:var(--muted);}
        .mpb-note-block.env{border-color:rgba(31,122,61,0.35);}
        .mpb-note-block ul{margin:6px 0 0;padding-left:16px;}
        .mpb-note-block li{margin-bottom:4px;}

        .mpb-subsection{margin-top:24px;padding-top:18px;border-top:1px solid var(--border);}
        .mpb-subsection-title{font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;font-weight:600;font-size:14.5px;margin-bottom:10px;}
        .mpb-tip-group{margin-bottom:10px;}
        .mpb-tip-group:last-child{margin-bottom:0;}
        .mpb-tip-system{font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin-bottom:4px;}
        .mpb-tip-list{margin:0;padding-left:16px;font-size:12.5px;color:var(--muted);line-height:1.6;}

        .mpb-why-list{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin:0;padding-left:16px;font-size:12.5px;color:var(--muted);line-height:1.7;}
        @media (max-width:500px){.mpb-why-list{grid-template-columns:1fr;}}

        .mpb-annual-check{margin-top:24px;padding:14px 16px;border-radius:10px;background:rgba(31,122,61,0.08);border:1px solid rgba(31,122,61,0.3);}
        .mpb-annual-check-title{font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;font-weight:600;font-size:13.5px;color:var(--amber);margin-bottom:4px;}
        .mpb-annual-check-text{font-size:12.5px;color:var(--muted);line-height:1.5;}

        .mpb-cta{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap;}
        .mpb-btn{font-weight:600;font-size:14px;padding:12px 18px;border-radius:8px;text-decoration:none;display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:1px solid transparent;}
        .mpb-btn-primary{background:var(--amber);color:#ffffff;}
        .mpb-btn-ghost{background:transparent;border-color:var(--border);color:var(--muted);}
        .mpb-btn-disabled{background:transparent;border-color:var(--border);color:var(--muted-2);cursor:not-allowed;position:relative;}
        .mpb-soon-badge{font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;font-size:9px;letter-spacing:.06em;text-transform:uppercase;background:var(--panel-2);border:1px solid var(--border);color:var(--muted-2);padding:2px 6px;border-radius:5px;}

        .mpb-footnote{margin-top:28px;font-size:12px;color:var(--muted-2);line-height:1.6;max-width:640px;}
